<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            margin: 0;
        }
        .timer {
            text-align: center;
            background-color: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }
        .timer:hover {
            transform: scale(1.05);
        }
        .fullscreen {
            text-align: right;
        }
        .time {
            font-size: 130px;
            margin-bottom: 20px;
            color: #333;
            font-weight: bold;
        }
        .buttons button, .set-timer button {
            font-size: 14px;
            padding: 8px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: #0e0e0e;
            transition: background-color 0.3s;
        }
        .buttons button {
            background-color: transparent;
            border: #0e0e0e solid 2px;
            border-radius: 50px;
        }
        .buttons button:hover {
            background-color: #69d5dd;
            border: #69d5dd solid 2px;
        }
        .set-timer {
            margin-top: 20px;
        }
        .set-timer input {
            font-size: 16px;
            padding: 10px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .set-timer button {
            background-color: #000000;
            color: white;
        }
        .set-timer button:hover {
            background-color: #69d5dd;
        }
        .mode-buttons {
            margin-bottom: 20px;
        }
        .mode-buttons button {
            font-size: 14px;
            padding: 8px 18px;
            margin: 0 5px 10px 5px;
            border: none;
            border-radius: 20px;
            background: transparent;
            border: 2px solid #0e0e0e;
            transition: background 0.3s, color 0.3s;
            cursor: pointer;
        }
        .mode-buttons button:focus {
            outline: 2px solid #69d5dd;
        }

        /* Media Queries for Responsive Design */

        @media (orientation: landscape) {
            body {
                flex-direction: row;
            }
            .timer {
                width: 50%;
            }
        }

        @media (orientation: portrait) {
            body {
                flex-direction: column;
            }
            .timer {
                width: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="timer" aria-label="Pomodoro Timer">
        <div class="fullscreen">
            <img src="fullscreen-svgrepo-com.svg" onclick="toggleFullscreen()" width="20" height="20" alt="Toggle Fullscreen" tabindex="0" aria-label="Toggle Fullscreen">
        </div>
        <div class="mode-buttons">
            <button id="pomodoroBtn" onclick="switchMode('pomodoro')" aria-label="Pomodoro Mode">Pomodoro</button>
            <button id="shortBreakBtn" onclick="switchMode('shortBreak')" aria-label="Short Break Mode">Short Break</button>
            <button id="longBreakBtn" onclick="switchMode('longBreak')" aria-label="Long Break Mode">Long Break</button>
        </div>
        <div class="time" id="time" aria-live="polite">25:00</div>
        <div class="progress" id="progress" style="margin-bottom:10px;"></div>
        <div class="buttons">
            <button onclick="startTimer()" aria-label="Start Timer">Start</button>
            <button onclick="stopTimer()" aria-label="Stop Timer">Stop</button>
            <button onclick="resetTimer()" aria-label="Reset Timer">Reset</button>
        </div>
        <div class="set-timer">
            <input type="number" id="minutes" placeholder="Custom Minutes" min="1" aria-label="Custom Minutes">
            <button onclick="setCustomTimer()" aria-label="Set Custom Timer">Set Timer</button>
        </div>
        <div id="sessionInfo" style="margin-top:15px; font-size:16px; color:#555;"></div>
    </div>

    <script>
        // Default durations in seconds
        const MODES = {
            pomodoro: { label: "Pomodoro", duration: 25 * 60 },
            shortBreak: { label: "Short Break", duration: 5 * 60 },
            longBreak: { label: "Long Break", duration: 15 * 60 }
        };
        let mode = 'pomodoro';
        let timer, isRunning = false, timeLeft = MODES[mode].duration;
        let sessionCount = 0, cycleCount = 0;
        const SESSIONS_PER_CYCLE = 4;

        const timeElement = document.getElementById('time');
        const progressElement = document.getElementById('progress');
        const sessionInfo = document.getElementById('sessionInfo');
        const modeButtons = {
            pomodoro: document.getElementById('pomodoroBtn'),
            shortBreak: document.getElementById('shortBreakBtn'),
            longBreak: document.getElementById('longBreakBtn')
        };

        function updateTimeDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timeElement.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            updateProgress();
        }

        function updateProgress() {
            if (mode === 'pomodoro') {
                progressElement.textContent = `Session: ${sessionCount + 1} / ${SESSIONS_PER_CYCLE} | Cycle: ${cycleCount + 1}`;
            } else {
                progressElement.textContent = '';
            }
        }

        function updateSessionInfo() {
            sessionInfo.textContent = `Mode: ${MODES[mode].label}`;
        }

        function switchMode(newMode) {
            stopTimer();
            mode = newMode;
            timeLeft = MODES[mode].duration;
            updateTimeDisplay();
            updateSessionInfo();
            highlightModeButton();
        }

        function highlightModeButton() {
            Object.keys(modeButtons).forEach(m => {
                modeButtons[m].style.backgroundColor = (m === mode) ? "#69d5dd" : "transparent";
                modeButtons[m].style.color = (m === mode) ? "#000" : "#0e0e0e";
            });
        }

        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                timer = setInterval(() => {
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        isRunning = false;
                        playAlarm();
                        handleSessionEnd();
                    } else {
                        timeLeft--;
                        updateTimeDisplay();
                    }
                }, 1000);
            }
        }

        function stopTimer() {
            clearInterval(timer);
            isRunning = false;
        }

        function resetTimer() {
            stopTimer();
            timeLeft = MODES[mode].duration;
            updateTimeDisplay();
        }

        function setCustomTimer() {
            const minutes = document.getElementById('minutes').value;
            if (minutes && !isNaN(minutes) && minutes > 0) {
                timeLeft = minutes * 60;
                updateTimeDisplay();
            } else {
                alert('Please enter a valid number of minutes.');
            }
        }

        function handleSessionEnd() {
            if (mode === 'pomodoro') {
                sessionCount++;
                if (sessionCount % SESSIONS_PER_CYCLE === 0) {
                    cycleCount++;
                    switchMode('longBreak');
                } else {
                    switchMode('shortBreak');
                }
            } else {
                if (mode === 'longBreak') {
                    sessionCount = 0;
                }
                switchMode('pomodoro');
            }
            updateSessionInfo();
            setTimeout(() => {
                startTimer();
            }, 1000);
        }

        function playAlarm() {
            try {
                const audio = new Audio('alarm.mp3');
                audio.play();
            } catch (e) {
                // fallback
                alert("Time's up!");
            }
            // Visual notification
            if (Notification && Notification.permission === "granted") {
                new Notification("Pomodoro Timer", { body: "Time's up!" });
            }
        }

        // Request notification permission on load
        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Save/restore state
        window.addEventListener('beforeunload', () => {
            localStorage.setItem('timeLeft', timeLeft);
            localStorage.setItem('isRunning', isRunning);
            localStorage.setItem('mode', mode);
            localStorage.setItem('sessionCount', sessionCount);
            localStorage.setItem('cycleCount', cycleCount);
        });

        window.addEventListener('load', () => {
            if (localStorage.getItem('timeLeft')) {
                timeLeft = parseInt(localStorage.getItem('timeLeft'), 10);
                isRunning = localStorage.getItem('isRunning') === 'true';
                mode = localStorage.getItem('mode') || 'pomodoro';
                sessionCount = parseInt(localStorage.getItem('sessionCount'), 10) || 0;
                cycleCount = parseInt(localStorage.getItem('cycleCount'), 10) || 0;
                updateTimeDisplay();
                updateSessionInfo();
                highlightModeButton();
                if (isRunning) {
                    startTimer();
                }
            } else {
                updateTimeDisplay();
                updateSessionInfo();
                highlightModeButton();
            }
        });
    </script>
</body>
</html>
